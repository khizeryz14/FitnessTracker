name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=detailed"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t fitnesstracker-api .

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    # only real pushes to main, never pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      Jwt__Key: ci-placeholder-key-only-for-ef-tooling-0123456789
      ConnectionStrings__Default: ${{ secrets.PROD_DB_CONNECTION }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install EF Core tool
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Build migration bundle
        run: >
          dotnet ef migrations bundle
          --project FitnessTracker/FitnessTracker.csproj
          --self-contained -r linux-x64
          --output efbundle

      - name: Apply migrations to production
        run: ./efbundle --connection "$ConnectionStrings__Default"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"