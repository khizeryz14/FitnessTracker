<!doctype html>
<html>
<head><meta charset="utf-8"><title>Notifications test</title></head>
<body>
  <h3>SignalR notification test</h3>
  <input id="token" size="80" placeholder="Paste JWT from /api/users/login" />
  <button id="connect">Connect</button>
  <pre id="log"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script>
    const log = (msg) => document.getElementById("log").textContent += msg + "\n";

    document.getElementById("connect").onclick = async () => {
      const token = document.getElementById("token").value.trim();
      const connection = new signalR.HubConnectionBuilder()
        .withUrl("/hubs/notifications", { accessTokenFactory: () => token })
        .withAutomaticReconnect()
        .build();

      connection.on("notification", (n) => log("PUSH: " + JSON.stringify(n)));
      connection.onreconnected(() => log("reconnected"));
      connection.onclose(() => log("closed"));

      try {
        await connection.start();
        log("connected");
      } catch (err) {
        log("failed: " + err);
      }
    };
  </script>
</body>
</html>
